# Proposal for the pipeline of code-corhuila/property-api-gateway (week 13, CP4).
# It lives in my fork; it does not change the team repository today.
name: gateway-security

on:
  pull_request:
    branches: [develop, qa]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/property-api-gateway
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/property-api-gateway
      - name: Build the gateway image
        run: docker build -f deploy/Dockerfile -t gateway:ci .
      - name: Vulnerability audit of the image (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gateway:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  negative-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/property-api-gateway
      - uses: actions/checkout@v4
        with:
          path: proposal
      - name: Start the gateway alone
        run: |
          docker network create platform
          docker build -f deploy/Dockerfile -t gateway:ci .
          docker run -d --name gateway --network platform -p 8080:8080 gateway:ci
          sleep 3
      - name: Negative authorization tests
        run: sh proposal/13-week/workshop/04-security-ci/negative-auth.sh http://localhost:8080
